version: '3.8'

services:
  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    restart: on-failure

  db:
    build: db/.
    restart: always
    ports:
      - "33060:3306"
    environment:
      MYSQL_ROOT_PASSWORD: example  # ensure this matches your App.java credentials

    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10